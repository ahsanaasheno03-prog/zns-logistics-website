name: Fetch ZNS Logistics site

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download new design
        run: |
          curl -L "https://py6oxjxfpjsxcz.cf.metaaiusercontent.com/index.html?hatch_share=zns-logistics-website-py6oxjxfpjsxcz&share_key=Y0HqbmXEgLjKGfNdNId3_qDHOIbNY72MlUJ77bZwSyc" -o index.html
          test $(stat -c%s index.html) -gt 100000
          grep -q "UPCOUNTRY" index.html
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fetch newest ZNS Logistics design" || exit 0
          git push
